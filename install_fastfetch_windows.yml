---
- name: Install Fastfetch via Winget
  hosts: windows
  gather_facts: false
  tasks:
    - name: Run winget install
      ansible.windows.win_powershell:
        script: |
          winget install --id Fastfetch-cli.Fastfetch --exact --source winget --accept-source-agreements --accept-package-agreements

    - name: Run Fastfetch when PowerShell starts
      ansible.windows.win_powershell:
        script: |
          $profilePath = '{{ powershell_profile_path }}'
          $profileDirectory = Split-Path -Parent $profilePath
          $blockStart = '# BEGIN ANSIBLE MANAGED FASTFETCH'
          $blockEnd = '# END ANSIBLE MANAGED FASTFETCH'

          if (-not (Test-Path -LiteralPath $profileDirectory)) {
              New-Item -ItemType Directory -Path $profileDirectory -Force | Out-Null
          }

          if (-not (Test-Path -LiteralPath $profilePath)) {
              New-Item -ItemType File -Path $profilePath -Force | Out-Null
          }

          $currentContent = Get-Content -LiteralPath $profilePath -Raw

          # Repair a previous append when the existing file had no trailing newline.
          $newContent = $currentContent -replace 'csc\.exefastfetch', 'csc.exe'

          # Remove both an existing managed block and standalone Fastfetch entries.
          $escapedBlockStart = [regex]::Escape($blockStart)
          $escapedBlockEnd = [regex]::Escape($blockEnd)
          $managedBlockPattern = "(?ms)^$escapedBlockStart\r?\n.*?^$escapedBlockEnd\r?\n?"
          $newContent = $newContent -replace $managedBlockPattern, ''
          $newContent = $newContent -replace '(?m)^\s*fastfetch\s*\r?\n?', ''
          $newContent = $newContent.TrimEnd("`r", "`n")

          $managedBlock = @"
          $blockStart
          fastfetch
          $blockEnd
          "@
          $newContent = "$newContent`r`n`r`n$managedBlock`r`n"

          if ($newContent -cne $currentContent) {
              Set-Content -LiteralPath $profilePath -Value $newContent -NoNewline
              $Ansible.Changed = $true
          }
          else {
              $Ansible.Changed = $false
          }
